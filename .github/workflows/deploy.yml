name: Deploy to GitHub Pages

on:
  push:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  template-preparation:
    name: Template preparation
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      prepared_sha: ${{ steps.prepared.outputs.sha }}
      branch: ${{ steps.prepared.outputs.branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Restore templates when needed
        run: |
          rm -f .templates-restored
          node scripts/check-and-restore-templates.mjs

      - name: Commit restored templates when changed
        run: |
          if [ -f .templates-restored ]; then
            git add \
              src/content/blog/.new-post.md \
              src/pages/.new-section.astro \
              src/pages/.new-feature-page.astro \
              src/pages/.new-resource-page.astro \
              src/pages/footer/.new-footer-section.astro
            if git diff --cached --quiet; then
              echo "Template restoration produced no file changes."
            else
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit -m "chore: restore reusable templates [skip ci]"
              git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
            fi
          else
            echo "Templates are already present; no commit is needed."
          fi

      - name: Export prepared commit
        id: prepared
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  build:
    name: Website build and validation
    if: github.ref_name == github.event.repository.default_branch
    needs: template-preparation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SITE_REPOSITORY: ${{ github.repository }}
      SITE_OWNER: ${{ github.repository_owner }}
      SITE_REF: ${{ needs.template-preparation.outputs.branch }}
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_BASE: ${{ vars.SITE_BASE }}
      SITE_EXCLUDE_REPOS: ${{ vars.SITE_EXCLUDE_REPOS }}
      SITE_INCLUDE_SITE_REPO: ${{ vars.SITE_INCLUDE_SITE_REPO }}
    steps:
      - name: Checkout prepared commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.template-preparation.outputs.prepared_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate navigation
        run: node scripts/generate-nav.mjs

      - name: Check templates
        run: node scripts/check-and-restore-templates.mjs

      - name: Editorial status
        run: node scripts/check-content.mjs

      - name: Astro validation
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Inspect generated output
        run: node scripts/check-dist.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages artifact
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact artifact from successful build
        id: deployment
        uses: actions/deploy-pages@v5
